<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Evidence to record before an aluminium profile shipment leaves</title><desc id="desc">A shipment evidence checklist for packaging approval, loading condition, labels and container seal.</desc><rect width="1200" height="470" fill="#f4f7fa"/><text x="60" y="68" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#15334b">Make shipment condition verifiable</text>
  <g font-family="Arial,sans-serif"><g transform="translate(70 130)"><rect width="320" height="230" rx="12" fill="#fff" stroke="#cbd6df" stroke-width="2"/><text x="24" y="48" font-size="21" font-weight="700" fill="#0b477a">Before packing</text><text x="24" y="93" font-size="17" fill="#243b4a">□ Approved packing spec / sample</text><text x="24" y="131" font-size="17" fill="#243b4a">□ Part ID / lengths / quantities</text><text x="24" y="169" font-size="17" fill="#243b4a">□ Material and finish condition</text><text x="24" y="207" font-size="17" fill="#243b4a">□ Damage exceptions recorded</text></g><g transform="translate(440 130)"><rect width="320" height="230" rx="12" fill="#fff" stroke="#cbd6df" stroke-width="2"/><text x="24" y="48" font-size="21" font-weight="700" fill="#0b477a">During loading</text><text x="24" y="93" font-size="17" fill="#243b4a">□ Dry, clean container condition</text><text x="24" y="131" font-size="17" fill="#243b4a">□ Support / blocking / restraint</text><text x="24" y="169" font-size="17" fill="#243b4a">□ Photos of load and labels</text><text x="24" y="207" font-size="17" fill="#243b4a">□ Seal number and close-out</text></g><g transform="translate(810 130)"><rect width="320" height="230" rx="12" fill="#fff" stroke="#cbd6df" stroke-width="2"/><text x="24" y="48" font-size="21" font-weight="700" fill="#0b477a">At receipt</text><text x="24" y="93" font-size="17" fill="#243b4a">□ Note visible transit damage</text><text x="24" y="131" font-size="17" fill="#243b4a">□ Photograph before unpacking</text><text x="24" y="169" font-size="17" fill="#243b4a">□ Match labels / packing list</text><text x="24" y="207" font-size="17" fill="#243b4a">□ Keep packaging for review</text></g></g>
  <text x="70" y="414" font-family="Arial,sans-serif" font-size="16" fill="#5a6e7d">Agree documentation, insurance and claims notice requirements in the purchase and transport arrangements.</text>
</svg>
