<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">Comparación homogénea de cotizaciones de extrusión</title><desc id="desc">Seis etapas de revisión, desde la sección y el espesor hasta los cargos aduaneros en destino.</desc><rect width="1200" height="640" fill="#f6f8fb"/><text x="600" y="60" text-anchor="middle" fill="#12345a" font-family="Arial,sans-serif" font-size="32" font-weight="700">Del plano al coste puesto en destino</text><text x="600" y="100" text-anchor="middle" fill="#536c83" font-family="Arial,sans-serif" font-size="19">Iguale el alcance; separe importes cotizados, estimados y confirmados.</text><g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(70 165)"><rect width="310" height="130" rx="8" fill="#dceaf5" stroke="#2370a8" stroke-width="3"/><text x="155" y="47" fill="#12345a" font-size="22" font-weight="700">1. Sección y espesor</text><text x="155" y="84" fill="#294d6d" font-size="17">Plano • revisión • tolerancias</text><text x="155" y="111" fill="#294d6d" font-size="17">Peso unitario • aleación</text></g><g transform="translate(445 165)"><rect width="310" height="130" rx="8" fill="#e2f0ed" stroke="#2c8270" stroke-width="3"/><text x="155" y="47" fill="#12345a" font-size="22" font-weight="700">2. Acabado y proceso</text><text x="155" y="84" fill="#294d6d" font-size="17">Recubrimiento • corte • CNC</text><text x="155" y="111" fill="#294d6d" font-size="17">Inspección • muestra</text></g><g transform="translate(820 165)"><rect width="310" height="130" rx="8" fill="#fff0d8" stroke="#bd791c" stroke-width="3"/><text x="155" y="47" fill="#12345a" font-size="22" font-weight="700">3. Matriz y cantidad</text><text x="155" y="84" fill="#294d6d" font-size="17">Matriz • preparación • mínimo</text><text x="155" y="111" fill="#294d6d" font-size="17">Tramos • coste de prueba</text></g><path d="M382 230h55m-12-10 12 10-12 10M757 230h55m-12-10 12 10-12 10" fill="none" stroke="#657d91" stroke-width="4"/><g transform="translate(70 365)"><rect width="310" height="130" rx="8" fill="#e7e5f3" stroke="#665a9a" stroke-width="3"/><text x="155" y="47" fill="#12345a" font-size="22" font-weight="700">4. Embalaje y flete</text><text x="155" y="84" fill="#294d6d" font-size="17">Protección • dimensiones</text><text x="155" y="111" fill="#294d6d" font-size="17">Ruta • lugar de entrega</text></g><g transform="translate(445 365)"><rect width="310" height="130" rx="8" fill="#f6e3e2" stroke="#b9534e" stroke-width="3"/><text x="155" y="47" fill="#12345a" font-size="22" font-weight="700">5. Aduana de importación</text><text x="155" y="84" fill="#294d6d" font-size="17">Clasificación • origen</text><text x="155" y="111" fill="#294d6d" font-size="17">Arancel • impuestos • medidas</text></g><g transform="translate(820 365)"><rect width="310" height="130" rx="8" fill="#dcebe4" stroke="#37765c" stroke-width="3"/><text x="155" y="47" fill="#12345a" font-size="22" font-weight="700">6. Coste final comparable</text><text x="155" y="84" fill="#294d6d" font-size="17">Misma moneda • unidades</text><text x="155" y="111" fill="#294d6d" font-size="17">Alcance claro • pendientes</text></g><path d="M380 430h55m-12-10 12 10-12 10M755 430h55m-12-10 12 10-12 10" fill="none" stroke="#657d91" stroke-width="4"/></g><text x="600" y="560" text-anchor="middle" fill="#536c83" font-family="Arial,sans-serif" font-size="18">Verifique impuestos para el producto, destino y fecha reales.</text></svg>
