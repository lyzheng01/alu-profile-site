<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">铝型材报价同口径比较</title><desc id="desc">从截面和壁厚到进口税费的六个报价核对阶段。</desc><rect width="1200" height="640" fill="#f6f8fb"/><text x="600" y="60" text-anchor="middle" fill="#12345a" font-family="Arial,sans-serif" font-size="32" font-weight="700">从图纸逐项核对到岸成本</text><text x="600" y="100" text-anchor="middle" fill="#536c83" font-family="Arial,sans-serif" font-size="19">先统一供货范围；区分已报价、估算和报关确认金额。</text><g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(70 165)"><rect width="310" height="130" rx="8" fill="#dceaf5" stroke="#2370a8" stroke-width="3"/><text x="155" y="47" fill="#12345a" font-size="22" font-weight="700">1. 截面与壁厚</text><text x="155" y="84" fill="#294d6d" font-size="17">图纸 • 版本 • 公差</text><text x="155" y="111" fill="#294d6d" font-size="17">单位重量 • 合金 • 状态</text></g><g transform="translate(445 165)"><rect width="310" height="130" rx="8" fill="#e2f0ed" stroke="#2c8270" stroke-width="3"/><text x="155" y="47" fill="#12345a" font-size="22" font-weight="700">2. 表面与加工</text><text x="155" y="84" fill="#294d6d" font-size="17">涂层 • 切割 • CNC</text><text x="155" y="111" fill="#294d6d" font-size="17">检验 • 样品确认</text></g><g transform="translate(820 165)"><rect width="310" height="130" rx="8" fill="#fff0d8" stroke="#bd791c" stroke-width="3"/><text x="155" y="47" fill="#12345a" font-size="22" font-weight="700">3. 模具与数量</text><text x="155" y="84" fill="#294d6d" font-size="17">模具 • 准备 • 起订量</text><text x="155" y="111" fill="#294d6d" font-size="17">价格档 • 试产费</text></g><path d="M382 230h55m-12-10 12 10-12 10M757 230h55m-12-10 12 10-12 10" fill="none" stroke="#657d91" stroke-width="4"/><g transform="translate(70 365)"><rect width="310" height="130" rx="8" fill="#e7e5f3" stroke="#665a9a" stroke-width="3"/><text x="155" y="47" fill="#12345a" font-size="22" font-weight="700">4. 包装与运输</text><text x="155" y="84" fill="#294d6d" font-size="17">防护 • 尺寸</text><text x="155" y="111" fill="#294d6d" font-size="17">路线 • 指定交货地</text></g><g transform="translate(445 365)"><rect width="310" height="130" rx="8" fill="#f6e3e2" stroke="#b9534e" stroke-width="3"/><text x="155" y="47" fill="#12345a" font-size="22" font-weight="700">5. 进口海关</text><text x="155" y="84" fill="#294d6d" font-size="17">归类 • 原产地</text><text x="155" y="111" fill="#294d6d" font-size="17">关税 • 税费 • 贸易措施</text></g><g transform="translate(820 365)"><rect width="310" height="130" rx="8" fill="#dcebe4" stroke="#37765c" stroke-width="3"/><text x="155" y="47" fill="#12345a" font-size="22" font-weight="700">6. 到岸成本对比</text><text x="155" y="84" fill="#294d6d" font-size="17">同币种 • 同单位</text><text x="155" y="111" fill="#294d6d" font-size="17">范围明确 • 待确认项列明</text></g><path d="M380 430h55m-12-10 12 10-12 10M755 430h55m-12-10 12 10-12 10" fill="none" stroke="#657d91" stroke-width="4"/></g><text x="600" y="560" text-anchor="middle" fill="#536c83" font-family="Arial,sans-serif" font-size="18">进口税费须按实际商品、目的国和发运日期核实。</text></svg>
