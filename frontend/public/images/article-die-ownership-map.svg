<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Three extrusion die ownership arrangements</title><desc id="desc">Compare buyer-owned, supplier-owned and buyer-paid supplier-held dies by payment, custody and transfer rights.</desc>
  <rect width="1200" height="560" fill="#f4f7fa"/><text x="60" y="68" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#15334b">Separate payment, ownership and custody</text>
  <g font-family="Arial,sans-serif"><g transform="translate(60 112)"><rect width="340" height="365" rx="14" fill="#fff" stroke="#cbd6df" stroke-width="2"/><rect width="340" height="72" rx="14" fill="#0b477a"/><text x="24" y="47" font-size="25" font-weight="700" fill="#fff">Buyer-owned</text><text x="24" y="125" font-size="20" font-weight="700" fill="#15334b">Buyer pays tooling</text><text x="24" y="171" font-size="18" fill="#3d5263">Buyer owns the physical die</text><text x="24" y="210" font-size="18" fill="#3d5263">Supplier may hold it in storage</text><path d="M28 247h280" stroke="#d7e0e7" stroke-width="2"/><text x="24" y="290" font-size="17" fill="#0b477a">Write release / transfer terms</text><text x="24" y="326" font-size="17" fill="#0b477a">Track die ID and condition</text></g>
  <g transform="translate(430 112)"><rect width="340" height="365" rx="14" fill="#fff" stroke="#cbd6df" stroke-width="2"/><rect width="340" height="72" rx="14" fill="#365f74"/><text x="24" y="47" font-size="25" font-weight="700" fill="#fff">Supplier-owned</text><text x="24" y="125" font-size="20" font-weight="700" fill="#15334b">Supplier funds or absorbs</text><text x="24" y="171" font-size="18" fill="#3d5263">Supplier normally keeps the die</text><text x="24" y="210" font-size="18" fill="#3d5263">Price / volume terms may apply</text><path d="M28 247h280" stroke="#d7e0e7" stroke-width="2"/><text x="24" y="290" font-size="17" fill="#365f74">Clarify included volume / price</text><text x="24" y="326" font-size="17" fill="#365f74">Plan supply continuity</text></g>
  <g transform="translate(800 112)"><rect width="340" height="365" rx="14" fill="#fff" stroke="#cbd6df" stroke-width="2"/><rect width="340" height="72" rx="14" fill="#c77b19"/><text x="24" y="47" font-size="24" font-weight="700" fill="#fff">Buyer-paid, held by supplier</text><text x="24" y="125" font-size="20" font-weight="700" fill="#15334b">Buyer pays separately</text><text x="24" y="171" font-size="18" fill="#3d5263">Supplier stores / maintains it</text><text x="24" y="210" font-size="18" fill="#3d5263">Custody is not ownership</text><path d="M28 247h280" stroke="#d7e0e7" stroke-width="2"/><text x="24" y="290" font-size="17" fill="#9c5d10">State property and release rights</text><text x="24" y="326" font-size="17" fill="#9c5d10">Agree upkeep and transfer costs</text></g></g>
  <text x="60" y="525" font-family="Arial,sans-serif" font-size="16" fill="#5a6e7d">Contract terms and local law control; labels alone do not settle title or transfer rights.</text>
</svg>
