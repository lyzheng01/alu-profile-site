<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Protecting aluminium profiles through export transport</title><desc id="desc">Five protective layers from part separation to container securing.</desc><rect width="1200" height="500" fill="#f4f7fa"/><text x="60" y="68" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#15334b">Protect the profile at each handling interface</text>
  <g font-family="Arial,sans-serif"><g transform="translate(60 125)"><rect width="200" height="230" rx="12" fill="#fff" stroke="#cbd6df" stroke-width="2"/><circle cx="100" cy="63" r="34" fill="#dce9ef"/><text x="100" y="71" text-anchor="middle" font-size="23" font-weight="700" fill="#0b477a">1</text><text x="18" y="127" font-size="18" font-weight="700" fill="#15334b">Separate faces</text><text x="18" y="160" font-size="15" fill="#506474">interleave / sleeve /</text><text x="18" y="184" font-size="15" fill="#506474">protect visible surfaces</text></g><g transform="translate(285 125)"><rect width="200" height="230" rx="12" fill="#fff" stroke="#cbd6df" stroke-width="2"/><circle cx="100" cy="63" r="34" fill="#dce9ef"/><text x="100" y="71" text-anchor="middle" font-size="23" font-weight="700" fill="#0b477a">2</text><text x="18" y="127" font-size="18" font-weight="700" fill="#15334b">Support length</text><text x="18" y="160" font-size="15" fill="#506474">spacers / dunnage /</text><text x="18" y="184" font-size="15" fill="#506474">avoid point loading</text></g><g transform="translate(510 125)"><rect width="200" height="230" rx="12" fill="#fff" stroke="#cbd6df" stroke-width="2"/><circle cx="100" cy="63" r="34" fill="#dce9ef"/><text x="100" y="71" text-anchor="middle" font-size="23" font-weight="700" fill="#0b477a">3</text><text x="18" y="127" font-size="18" font-weight="700" fill="#15334b">Protect bundle</text><text x="18" y="160" font-size="15" fill="#506474">edge guards / wrap /</text><text x="18" y="184" font-size="15" fill="#506474">controlled strapping</text></g><g transform="translate(735 125)"><rect width="200" height="230" rx="12" fill="#fff" stroke="#cbd6df" stroke-width="2"/><circle cx="100" cy="63" r="34" fill="#c77b19"/><text x="100" y="71" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">4</text><text x="18" y="127" font-size="18" font-weight="700" fill="#15334b">Identify bundle</text><text x="18" y="160" font-size="15" fill="#506474">part / revision / qty /</text><text x="18" y="184" font-size="15" fill="#506474">bundle and destination</text></g><g transform="translate(960 125)"><rect width="200" height="230" rx="12" fill="#fff" stroke="#cbd6df" stroke-width="2"/><circle cx="100" cy="63" r="34" fill="#365f74"/><text x="100" y="71" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">5</text><text x="18" y="127" font-size="18" font-weight="700" fill="#15334b">Secure load</text><text x="18" y="160" font-size="15" fill="#506474">block / brace / inspect</text><text x="18" y="184" font-size="15" fill="#506474">before container close</text></g></g>
  <text x="60" y="420" font-family="Arial,sans-serif" font-size="16" fill="#5a6e7d">Packaging materials and restraint design must match actual profile dimensions, mass, route, container and handling plan.</text>
</svg>
