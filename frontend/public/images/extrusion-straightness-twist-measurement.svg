<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="t d">
 <title id="t">How to distinguish straightness and twist inspection</title><desc id="d">The left panel shows a bowed profile against a straight reference over a stated length; the right shows cross-section rotation measured from a reference face.</desc>
 <defs><marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#07818c"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#183344}.h{font-size:36px;font-weight:bold}.sh{font-size:27px;font-weight:bold}.s{font-size:20px;fill:#536a7b}.dim{stroke:#07818c;stroke-width:3;marker-start:url(#a);marker-end:url(#a)}.guide{stroke:#96aab8;stroke-width:3;stroke-dasharray:8 8}.rail{stroke:#374f60;stroke-width:6}.metal{fill:#b8c7d2;stroke:#526c7e;stroke-width:3}</style></defs>
 <rect width="1400" height="720" rx="24" fill="#f2f6fa"/><text x="60" y="70" class="h">Straightness and twist need separate checks</text>
 <rect x="45" y="110" width="635" height="550" rx="20" fill="#fff" stroke="#d4e0e8" stroke-width="2"/><rect x="720" y="110" width="635" height="550" rx="20" fill="#fff" stroke="#d4e0e8" stroke-width="2"/>
 <text x="80" y="160" class="sh">A  Straightness</text><text x="80" y="194" class="s">Bow away from a reference line along the profile</text>
 <line x1="110" y1="370" x2="610" y2="370" class="rail"/><path d="M110 343 Q350 260 610 343" fill="none" stroke="#95aabd" stroke-width="28" stroke-linecap="round"/><line x1="110" y1="415" x2="610" y2="415" class="dim"/><line x1="110" y1="385" x2="110" y2="430" class="guide"/><line x1="610" y1="385" x2="610" y2="430" class="guide"/><text x="275" y="454" class="s">specified inspection length</text><line x1="365" y1="300" x2="365" y2="368" class="dim"/><text x="383" y="314" class="s">bow</text>
 <text x="80" y="520" class="s">Record the support points and whether the requirement</text><text x="80" y="550" class="s">applies to the full bar, each cut piece, or both.</text>
 <text x="755" y="160" class="sh">B  Twist</text><text x="755" y="194" class="s">Rotation of the section around the profile axis</text>
 <path d="M800 320L1135 300L1210 335L875 355Z M875 355L1210 335L1210 385L875 405Z" class="metal"/><path d="M800 320L875 355L875 405L800 370Z" fill="#849aaa" stroke="#526c7e" stroke-width="3"/><path d="M1135 300L1210 335L1210 385L1135 350Z" fill="#d8e2e9" stroke="#526c7e" stroke-width="3"/><path d="M820 285L1180 265" fill="none" stroke="#cb7024" stroke-width="4" stroke-dasharray="10 8"/><path d="M900 260 A60 34 0 0 1 980 257" fill="none" stroke="#07818c" stroke-width="4" marker-end="url(#a)"/><text x="1000" y="265" class="s">rotation</text>
 <line x1="800" y1="445" x2="1210" y2="445" class="dim"/><text x="915" y="480" class="s">specified inspection length</text><text x="755" y="540" class="s">Identify the reference face, support setup and</text><text x="755" y="570" class="s">measurement method before setting a limit.</text>
 <text x="60" y="695" class="s">Diagrams explain the concepts only; confirm numeric limits against the applicable standard and the extruder's capability.</text>
</svg>
