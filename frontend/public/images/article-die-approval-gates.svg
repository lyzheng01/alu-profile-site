<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Tooling approval checkpoints</title><desc id="desc">Five documented checkpoints from drawing freeze through die transfer readiness.</desc><rect width="1200" height="440" fill="#f4f7fa"/><text x="60" y="65" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#15334b">Five approval gates before and after tooling</text>
  <path d="M118 208H1080" stroke="#a9bac7" stroke-width="8" stroke-linecap="round"/>
  <g font-family="Arial,sans-serif" text-anchor="middle"><g><circle cx="130" cy="208" r="28" fill="#0b477a"/><text x="130" y="217" font-size="22" font-weight="700" fill="#fff">1</text><text x="130" y="275" font-size="18" font-weight="700" fill="#15334b">Drawing frozen</text><text x="130" y="305" font-size="15" fill="#506474">Revision / units</text><text x="130" y="330" font-size="15" fill="#506474">interfaces / tolerances</text></g><g><circle cx="365" cy="208" r="28" fill="#0b477a"/><text x="365" y="217" font-size="22" font-weight="700" fill="#fff">2</text><text x="365" y="275" font-size="18" font-weight="700" fill="#15334b">Tooling terms</text><text x="365" y="305" font-size="15" fill="#506474">scope / title / custody</text><text x="365" y="330" font-size="15" fill="#506474">correction allowance</text></g><g><circle cx="600" cy="208" r="28" fill="#c77b19"/><text x="600" y="217" font-size="22" font-weight="700" fill="#fff">3</text><text x="600" y="275" font-size="18" font-weight="700" fill="#15334b">Trial sample</text><text x="600" y="305" font-size="15" fill="#506474">measured against</text><text x="600" y="330" font-size="15" fill="#506474">agreed criteria</text></g><g><circle cx="835" cy="208" r="28" fill="#0b477a"/><text x="835" y="217" font-size="22" font-weight="700" fill="#fff">4</text><text x="835" y="275" font-size="18" font-weight="700" fill="#15334b">Written release</text><text x="835" y="305" font-size="15" fill="#506474">approved sample /</text><text x="835" y="330" font-size="15" fill="#506474">production revision</text></g><g><circle cx="1070" cy="208" r="28" fill="#365f74"/><text x="1070" y="217" font-size="22" font-weight="700" fill="#fff">5</text><text x="1070" y="275" font-size="18" font-weight="700" fill="#15334b">Asset record</text><text x="1070" y="305" font-size="15" fill="#506474">ID / condition /</text><text x="1070" y="330" font-size="15" fill="#506474">release contact</text></g></g>
  <text x="60" y="397" font-family="Arial,sans-serif" font-size="16" fill="#5a6e7d">A sample approval confirms only the characteristics and revision actually reviewed.</text>
</svg>
