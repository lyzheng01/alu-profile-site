<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">A espessura altera a seção e o peso</title><desc id="desc">Duas seções de alumínio com contornos externos semelhantes e espessuras e áreas metálicas diferentes.</desc><rect width="1200" height="620" fill="#f5f8fc"/><text x="600" y="58" text-anchor="middle" fill="#12345a" font-family="Arial,sans-serif" font-size="32" font-weight="700">Contorno semelhante. Área diferente.</text><text x="300" y="112" text-anchor="middle" fill="#31516f" font-family="Arial,sans-serif" font-size="21">Seção ilustrativa A</text><text x="900" y="112" text-anchor="middle" fill="#31516f" font-family="Arial,sans-serif" font-size="21">Seção ilustrativa B</text><g transform="translate(160 155)"><path d="M0 0H280V32H32V248H248V32H280V280H0Z M68 68H212V212H68Z" fill="#8fb6d8" fill-rule="evenodd" stroke="#15528a" stroke-width="5"/><text x="140" y="-20" text-anchor="middle" fill="#173f67" font-family="Arial,sans-serif" font-size="18">envelope externo semelhante</text><text x="140" y="320" text-anchor="middle" fill="#31516f" font-family="Arial,sans-serif" font-size="19">Verifique a seção e o peso por metro</text></g><g transform="translate(760 155)"><path d="M0 0H280V54H54V226H226V54H280V280H0Z M98 98H182V182H98Z" fill="#e6a94d" fill-rule="evenodd" stroke="#15528a" stroke-width="5"/><text x="140" y="-20" text-anchor="middle" fill="#173f67" font-family="Arial,sans-serif" font-size="18">envelope externo semelhante</text><text x="140" y="320" text-anchor="middle" fill="#31516f" font-family="Arial,sans-serif" font-size="19">Espessura diferente; sem escala</text></g><rect x="72" y="535" width="1056" height="52" rx="4" fill="#123f73"/><text x="600" y="569" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700">Compare todo o desenho aprovado, não uma parede isolada</text></svg>
