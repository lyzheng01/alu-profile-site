    <path d="m743 149 193 55v72l-193-55z" fill="url(#side)" stroke="#647b87" stroke-width="3"/>
    <path d="M215 357 777 250l193 55-562 109z" fill="#f2f7f9" stroke="#718792" stroke-width="3"/>
    <path d="m215 357 562-107v70L215 427z" fill="url(#metal)" stroke="#718792" stroke-width="3"/>
    <path d="m777 250 193 55v70l-193-55z" fill="url(#side)" stroke="#647b87" stroke-width="3"/>
    <path d="M248 455 808 348l188 53-559 110z" fill="#f2f7f9" stroke="#718792" stroke-width="3"/>
    <path d="m248 455 560-107v68L248 523z" fill="url(#metal)" stroke="#718792" stroke-width="3"/>
