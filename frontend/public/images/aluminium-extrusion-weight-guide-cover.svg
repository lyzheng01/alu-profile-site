<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Aluminium extrusion weight guide</title>
  <desc id="desc">Technical illustration connecting aluminium profile cross-sections, length and linear weight.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f4f8fa"/><stop offset="1" stop-color="#dce8ee"/></linearGradient>
