    <linearGradient id="side" x2="0" y2="1"><stop stop-color="#8ea2ad"/><stop offset="1" stop-color="#506774"/></linearGradient>
    <filter id="shadow" x="-.2" y="-.5" width="1.5" height="2"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#19364a" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)"/>
  <circle cx="920" cy="150" r="205" fill="#d2e2e8" opacity=".55"/>
