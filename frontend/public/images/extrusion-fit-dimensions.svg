<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="t d">
 <title id="t">Mark functional dimensions on an aluminum extrusion cross-section</title><desc id="d">A T-slot profile cross-section shows the outer width and slot opening as separate functional dimensions with datums.</desc>
 <defs><marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#07818c"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#183344}.h{font-size:34px;font-weight:bold}.s{font-size:22px;fill:#506a7b}.l{font-size:21px;font-weight:bold}.n{font-size:18px;fill:#4f6675}.dim{stroke:#07818c;stroke-width:3;marker-start:url(#a);marker-end:url(#a)}.ext{stroke:#93a8b6;stroke-width:2;stroke-dasharray:6 6}</style></defs>
 <rect width="1200" height="660" rx="24" fill="#f2f6fa"/><text x="60" y="72" class="h">Dimension the features that control fit</text><text x="60" y="112" class="s">Show the measurement points and datum; do not treat every line on the section as the same dimension type.</text>
 <path d="M280 260H820V480H720V390H380V480H280Z M385 315H470V355H385Z M630 315H715V355H630Z" fill="#c4d2dc" stroke="#526c7e" stroke-width="8" fill-rule="evenodd"/>
 <line x1="280" y1="205" x2="820" y2="205" class="dim"/><line x1="280" y1="215" x2="280" y2="250" class="ext"/><line x1="820" y1="215" x2="820" y2="250" class="ext"/><text x="480" y="184" class="l">Overall width</text>
 <line x1="380" y1="535" x2="720" y2="535" class="dim"/><line x1="380" y1="490" x2="380" y2="550" class="ext"/><line x1="720" y1="490" x2="720" y2="550" class="ext"/><text x="473" y="580" class="l">Slot opening</text>
 <line x1="238" y1="260" x2="238" y2="480" class="dim"/><line x1="250" y1="260" x2="278" y2="260" class="ext"/><line x1="250" y1="480" x2="278" y2="480" class="ext"/><text x="70" y="372" class="l">Overall</text><text x="86" y="400" class="l">height</text>
 <path d="M820 480h45v45" fill="none" stroke="#d06c21" stroke-width="5"/><text x="875" y="512" class="l" fill="#a95517">Datum A</text><text x="875" y="546" class="n">Reference face for inspection</text>
 <rect x="890" y="220" width="250" height="145" rx="16" fill="#fff" stroke="#d5e0e8" stroke-width="2"/><text x="914" y="260" class="l">Ask:</text><text x="914" y="298" class="n">Which faces mate?</text><text x="914" y="330" class="n">Where is each size measured?</text>
 <text x="60" y="625" class="n">Illustration only. Set actual tolerances from the applicable standard and confirmed part function.</text>
</svg>
