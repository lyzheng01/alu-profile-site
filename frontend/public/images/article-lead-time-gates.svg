<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
  <title id="title">Aluminium extrusion project schedule stages</title><desc id="desc">A six-stage project schedule from requirements to delivery, with approval gates and buyer inputs.</desc><rect width="1200" height="510" fill="#f4f7fa"/><text x="60" y="66" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#15334b">Build the schedule from gates, not one promise date</text>
  <g font-family="Arial,sans-serif"><g transform="translate(60 120)"><rect width="165" height="230" rx="12" fill="#fff" stroke="#cbd6df"/><rect width="165" height="54" rx="12" fill="#0b477a"/><text x="18" y="36" font-size="17" font-weight="700" fill="#fff">1 · Scope</text><text x="17" y="93" font-size="15" fill="#243b4a">Drawing / revision</text><text x="17" y="122" font-size="15" fill="#243b4a">alloy / finish</text><text x="17" y="151" font-size="15" fill="#243b4a">quantity / delivery</text><text x="17" y="202" font-size="13" fill="#637785">Buyer confirms inputs</text></g><g transform="translate(255 120)"><rect width="165" height="230" rx="12" fill="#fff" stroke="#cbd6df"/><rect width="165" height="54" rx="12" fill="#365f74"/><text x="18" y="36" font-size="17" font-weight="700" fill="#fff">2 · Feasibility</text><text x="17" y="93" font-size="15" fill="#243b4a">Press / die review</text><text x="17" y="122" font-size="15" fill="#243b4a">open questions</text><text x="17" y="151" font-size="15" fill="#243b4a">quote scope</text><text x="17" y="202" font-size="13" fill="#637785">Written assumptions</text></g><g transform="translate(450 120)"><rect width="165" height="230" rx="12" fill="#fff" stroke="#cbd6df"/><rect width="165" height="54" rx="12" fill="#c77b19"/><text x="18" y="36" font-size="17" font-weight="700" fill="#fff">3 · Tooling</text><text x="17" y="93" font-size="15" fill="#243b4a">Build / tryout</text><text x="17" y="122" font-size="15" fill="#243b4a">correction loop</text><text x="17" y="151" font-size="15" fill="#243b4a">sample measurement</text><text x="17" y="202" font-size="13" fill="#637785">Complexity-dependent</text></g><g transform="translate(645 120)"><rect width="165" height="230" rx="12" fill="#fff" stroke="#cbd6df"/><rect width="165" height="54" rx="12" fill="#365f74"/><text x="18" y="36" font-size="17" font-weight="700" fill="#fff">4 · Approval</text><text x="17" y="93" font-size="15" fill="#243b4a">Sample / finish</text><text x="17" y="122" font-size="15" fill="#243b4a">inspection scope</text><text x="17" y="151" font-size="15" fill="#243b4a">written release</text><text x="17" y="202" font-size="13" fill="#637785">Buyer response time</text></g><g transform="translate(840 120)"><rect width="165" height="230" rx="12" fill="#fff" stroke="#cbd6df"/><rect width="165" height="54" rx="12" fill="#0b477a"/><text x="18" y="36" font-size="17" font-weight="700" fill="#fff">5 · Production</text><text x="17" y="93" font-size="15" fill="#243b4a">Run / finish / CNC</text><text x="17" y="122" font-size="15" fill="#243b4a">inspection / packing</text><text x="17" y="151" font-size="15" fill="#243b4a">batch release</text><text x="17" y="202" font-size="13" fill="#637785">Scope drives duration</text></g><g transform="translate(1035 120)"><rect width="165" height="230" rx="12" fill="#fff" stroke="#cbd6df"/><rect width="165" height="54" rx="12" fill="#365f74"/><text x="18" y="36" font-size="17" font-weight="700" fill="#fff">6 · Dispatch</text><text x="17" y="93" font-size="15" fill="#243b4a">booking / documents</text><text x="17" y="122" font-size="15" fill="#243b4a">port / transit / receipt</text><text x="17" y="151" font-size="15" fill="#243b4a">destination calendar</text><text x="17" y="202" font-size="13" fill="#637785">Transit is separate</text></g></g>
  <path d="M228 237h22m173 0h22m173 0h22m173 0h22m173 0h22" stroke="#92a6b5" stroke-width="5"/><text x="60" y="415" font-family="Arial,sans-serif" font-size="17" fill="#9c5d10">Schedule risk rises when a gate is assumed complete but has no named owner, due date or acceptance record.</text>
</svg>
