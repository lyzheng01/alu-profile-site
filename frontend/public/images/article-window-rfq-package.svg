<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Window profile RFQ information map</title>
  <desc id="desc">Four connected RFQ groups: project performance, profile interfaces, finish and fabrication, and evidence and delivery.</desc>
  <rect width="1200" height="560" fill="#f4f7fa"/>
  <text x="60" y="70" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#12345a">A useful RFQ connects four information groups</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(60 135)"><rect width="245" height="310" rx="8" fill="#fff" stroke="#c8d5e1" stroke-width="2"/><rect width="245" height="58" rx="8" fill="#1269a8"/><text x="20" y="38" font-size="21" font-weight="700" fill="#fff">1 · Project need</text><text x="22" y="100" font-size="17" fill="#24384c">• Opening type and use</text><text x="22" y="140" font-size="17" fill="#24384c">• Climate / exposure</text><text x="22" y="180" font-size="17" fill="#24384c">• Target test evidence</text><text x="22" y="220" font-size="17" fill="#24384c">• Project market / code</text><text x="22" y="270" font-size="15" fill="#526477">Define the outcome first.</text></g>
    <g transform="translate(350 135)"><rect width="245" height="310" rx="8" fill="#fff" stroke="#c8d5e1" stroke-width="2"/><rect width="245" height="58" rx="8" fill="#167c73"/><text x="20" y="38" font-size="21" font-weight="700" fill="#fff">2 · Profile system</text><text x="22" y="100" font-size="17" fill="#24384c">• Section / revision</text><text x="22" y="140" font-size="17" fill="#24384c">• Alloy and temper</text><text x="22" y="180" font-size="17" fill="#24384c">• Barrier / interfaces</text><text x="22" y="220" font-size="17" fill="#24384c">• Critical tolerances</text><text x="22" y="270" font-size="15" fill="#526477">Attach legible drawings.</text></g>
    <g transform="translate(640 135)"><rect width="245" height="310" rx="8" fill="#fff" stroke="#c8d5e1" stroke-width="2"/><rect width="245" height="58" rx="8" fill="#bd7624"/><text x="20" y="38" font-size="21" font-weight="700" fill="#fff">3 · Make / finish</text><text x="22" y="100" font-size="17" fill="#24384c">• Glazing and hardware</text><text x="22" y="140" font-size="17" fill="#24384c">• Gaskets / drainage</text><text x="22" y="180" font-size="17" fill="#24384c">• Coating / colour</text><text x="22" y="220" font-size="17" fill="#24384c">• Machining / assembly</text><text x="22" y="270" font-size="15" fill="#526477">Mark approved samples.</text></g>
    <g transform="translate(930 135)"><rect width="210" height="310" rx="8" fill="#fff" stroke="#c8d5e1" stroke-width="2"/><rect width="210" height="58" rx="8" fill="#394d63"/><text x="18" y="38" font-size="21" font-weight="700" fill="#fff">4 · Order plan</text><text x="20" y="100" font-size="17" fill="#24384c">• Quantities / lots</text><text x="20" y="140" font-size="17" fill="#24384c">• Samples / approval</text><text x="20" y="180" font-size="17" fill="#24384c">• Packing / labels</text><text x="20" y="220" font-size="17" fill="#24384c">• Destination / terms</text><text x="20" y="270" font-size="15" fill="#526477">Compare like with like.</text></g>
  </g>
  <path d="M307 290h35m253 0h35m253 0h35" fill="none" stroke="#71879a" stroke-width="5" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#71879a"/></marker></defs>
  <text x="60" y="500" font-family="Arial,sans-serif" font-size="17" fill="#526477">If a requirement is not defined yet, label it “to be proposed and approved” rather than leaving the supplier to assume.</text>
</svg>
