<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">Comparação equivalente de cotações de extrusão</title><desc id="desc">Seis etapas de análise, da seção e espessura aos encargos alfandegários no destino.</desc><rect width="1200" height="640" fill="#f6f8fb"/><text x="600" y="60" text-anchor="middle" fill="#12345a" font-family="Arial,sans-serif" font-size="32" font-weight="700">Do desenho ao custo posto no destino</text><text x="600" y="100" text-anchor="middle" fill="#536c83" font-family="Arial,sans-serif" font-size="19">Iguale o escopo; separe valores cotados, estimados e confirmados.</text><g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(70 165)"><rect width="310" height="130" rx="8" fill="#dceaf5" stroke="#2370a8" stroke-width="3"/><text x="155" y="47" fill="#12345a" font-size="22" font-weight="700">1. Seção e espessura</text><text x="155" y="84" fill="#294d6d" font-size="17">Desenho • revisão • tolerâncias</text><text x="155" y="111" fill="#294d6d" font-size="17">Peso unitário • liga</text></g><g transform="translate(445 165)"><rect width="310" height="130" rx="8" fill="#e2f0ed" stroke="#2c8270" stroke-width="3"/><text x="155" y="47" fill="#12345a" font-size="22" font-weight="700">2. Acabamento e processo</text><text x="155" y="84" fill="#294d6d" font-size="17">Revestimento • corte • CNC</text><text x="155" y="111" fill="#294d6d" font-size="17">Inspeção • amostra</text></g><g transform="translate(820 165)"><rect width="310" height="130" rx="8" fill="#fff0d8" stroke="#bd791c" stroke-width="3"/><text x="155" y="47" fill="#12345a" font-size="22" font-weight="700">3. Matriz e quantidade</text><text x="155" y="84" fill="#294d6d" font-size="17">Matriz • preparação • mínimo</text><text x="155" y="111" fill="#294d6d" font-size="17">Faixas • custo de teste</text></g><path d="M382 230h55m-12-10 12 10-12 10M757 230h55m-12-10 12 10-12 10" fill="none" stroke="#657d91" stroke-width="4"/><g transform="translate(70 365)"><rect width="310" height="130" rx="8" fill="#e7e5f3" stroke="#665a9a" stroke-width="3"/><text x="155" y="47" fill="#12345a" font-size="22" font-weight="700">4. Embalagem e frete</text><text x="155" y="84" fill="#294d6d" font-size="17">Proteção • dimensões</text><text x="155" y="111" fill="#294d6d" font-size="17">Rota • local de entrega</text></g><g transform="translate(445 365)"><rect width="310" height="130" rx="8" fill="#f6e3e2" stroke="#b9534e" stroke-width="3"/><text x="155" y="47" fill="#12345a" font-size="22" font-weight="700">5. Alfândega de importação</text><text x="155" y="84" fill="#294d6d" font-size="17">Classificação • origem</text><text x="155" y="111" fill="#294d6d" font-size="17">Tarifa • impostos • medidas</text></g><g transform="translate(820 365)"><rect width="310" height="130" rx="8" fill="#dcebe4" stroke="#37765c" stroke-width="3"/><text x="155" y="47" fill="#12345a" font-size="22" font-weight="700">6. Custo final comparável</text><text x="155" y="84" fill="#294d6d" font-size="17">Mesma moeda • unidades</text><text x="155" y="111" fill="#294d6d" font-size="17">Escopo claro • pendências</text></g><path d="M380 430h55m-12-10 12 10-12 10M755 430h55m-12-10 12 10-12 10" fill="none" stroke="#657d91" stroke-width="4"/></g><text x="600" y="560" text-anchor="middle" fill="#536c83" font-family="Arial,sans-serif" font-size="18">Confirme os tributos para o produto, destino e data reais.</text></svg>
