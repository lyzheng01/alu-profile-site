<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Lista RFQ para perfiles T-slot y accesorios</title><desc id="desc">Cinco pasos para identificar el perfil, especificar piezas, revisar el montaje, aprobar una muestra y confirmar el alcance comercial.</desc><rect width="1200" height="760" fill="#f6f8fa"/><text x="64" y="76" fill="#17324d" font-family="Arial,sans-serif" font-size="36" font-weight="700">Una RFQ T-slot más clara</text><text x="64" y="116" fill="#526575" font-family="Arial,sans-serif" font-size="21">Separe los datos confirmados de las preguntas pendientes.</text>
  <g font-family="Arial,sans-serif"><g transform="translate(64 165)"><rect width="1072" height="92" rx="10" fill="#fff" stroke="#cbd5dd" stroke-width="2"/><circle cx="48" cy="46" r="27" fill="#087e8b"/><text x="48" y="54" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">1</text><text x="96" y="41" fill="#17324d" font-size="24" font-weight="700">Identifique el perfil</text><text x="96" y="70" fill="#526575" font-size="19">Número de pieza · revisión · ranura e interfaces</text></g>
  <g transform="translate(64 273)"><rect width="1072" height="92" rx="10" fill="#fff" stroke="#cbd5dd" stroke-width="2"/><circle cx="48" cy="46" r="27" fill="#087e8b"/><text x="48" y="54" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">2</text><text x="96" y="41" fill="#17324d" font-size="24" font-weight="700">Nombre cada pieza</text><text x="96" y="70" fill="#526575" font-size="19">Tuerca y tornillo · escuadra · conector · retenedor · cantidad</text></g>
  <g transform="translate(64 381)"><rect width="1072" height="92" rx="10" fill="#fff" stroke="#cbd5dd" stroke-width="2"/><circle cx="48" cy="46" r="27" fill="#087e8b"/><text x="48" y="54" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">3</text><text x="96" y="41" fill="#17324d" font-size="24" font-weight="700">Describa el montaje</text><text x="96" y="70" fill="#526575" font-size="19">Orientación · secuencia · panel · acceso a herramientas</text></g>
  <g transform="translate(64 489)"><rect width="1072" height="92" rx="10" fill="#fff" stroke="#cbd5dd" stroke-width="2"/><circle cx="48" cy="46" r="27" fill="#087e8b"/><text x="48" y="54" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">4</text><text x="96" y="41" fill="#17324d" font-size="24" font-weight="700">Apruebe una muestra representativa</text><text x="96" y="70" fill="#526575" font-size="19">Ajuste · alineación · asiento · acceso · acabado</text></g>
  <g transform="translate(64 597)"><rect width="1072" height="92" rx="10" fill="#fff" stroke="#cbd5dd" stroke-width="2"/><circle cx="48" cy="46" r="27" fill="#d56b25"/><text x="48" y="54" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">5</text><text x="96" y="41" fill="#17324d" font-size="24" font-weight="700">Cierre el alcance del pedido</text><text x="96" y="70" fill="#526575" font-size="19">Incluido y excluido · acabado · embalaje · destino · plazo</text></g></g>
</svg>
