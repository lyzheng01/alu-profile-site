<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Keep profile net weight separate from shipping gross weight</title>
  <desc id="desc">Illustration of aluminium profiles packed for shipment and weighed, distinguishing profile net weight, packaging tare and gross shipment weight.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fafb"/><stop offset="1" stop-color="#e4edf0"/></linearGradient><linearGradient id="metal" x2="0" y2="1"><stop stop-color="#f8fcfd"/><stop offset=".55" stop-color="#b7c7ce"/><stop offset="1" stop-color="#758c97"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="11" stdDeviation="12" flood-color="#193949" flood-opacity=".17"/></filter></defs>
  <rect width="1200" height="675" rx="30" fill="url(#bg)"/>
  <text x="70" y="84" font-family="Arial,sans-serif" font-size="26" font-weight="700" letter-spacing="2" fill="#1d4559">WEIGHT FOR SHIPPING</text>
  <g filter="url(#s)">
    <path d="M150 250h600v98H150z" fill="#edf2f4" stroke="#8298a2" stroke-width="4"/>
    <path d="M190 214h525v30H190z" fill="#c9d6db" stroke="#718994" stroke-width="3"/>
    <path d="M220 180h495v30H220z" fill="url(#metal)" stroke="#718994" stroke-width="3"/>
    <path d="M200 350h520v54H200z" fill="#ae7b42"/><path d="M220 404h35v59h-35zm450 0h35v59h-35z" fill="#826039"/>
    <path d="M275 170v187M390 170v187M505 170v187M620 170v187" stroke="#d8b37b" stroke-width="8"/>
  </g>
  <g transform="translate(822 180)" filter="url(#s)">
    <path d="M0 149h260l-26 154H26z" fill="#173d51"/>
    <rect x="22" y="84" width="216" height="82" rx="15" fill="#fff" stroke="#7b929c" stroke-width="4"/>
    <rect x="49" y="103" width="162" height="40" rx="7" fill="#dceff0"/>
    <path d="M70 123h18m15 0h18m15 0h18m15 0h18" stroke="#17818b" stroke-width="6" stroke-linecap="round"/>
    <path d="M55 302h150" stroke="#416477" stroke-width="12" stroke-linecap="round"/>
  </g>
  <g transform="translate(174 505)" font-family="Arial,sans-serif">
    <rect width="268" height="74" rx="16" fill="#fff" stroke="#cbdbe0" stroke-width="2"/><text x="134" y="32" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="1" fill="#176d78">PROFILE NET</text><text x="134" y="57" text-anchor="middle" font-size="15" fill="#587482">metal only</text>
    <text x="474" y="48" text-anchor="middle" font-size="32" font-weight="700" fill="#16818b">+</text>
    <rect x="540" width="268" height="74" rx="16" fill="#fff" stroke="#cbdbe0" stroke-width="2"/><text x="674" y="32" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="1" fill="#176d78">PACKAGING</text><text x="674" y="57" text-anchor="middle" font-size="15" fill="#587482">pallet / wrap / straps</text>
    <text x="868" y="48" text-anchor="middle" font-size="32" font-weight="700" fill="#16818b">=</text>
    <rect x="938" width="190" height="74" rx="16" fill="#dff0f1" stroke="#9fcdd0" stroke-width="2"/><text x="1033" y="32" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="1" fill="#176d78">GROSS</text><text x="1033" y="57" text-anchor="middle" font-size="15" fill="#587482">shipment weight</text>
  </g>
  <text x="600" y="625" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#587482">Confirm the weighing basis and records with the supplier or carrier.</text>
</svg>
