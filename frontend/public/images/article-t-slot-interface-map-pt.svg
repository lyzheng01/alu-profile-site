<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Mapa de interfaces T-slot</title><desc id="desc">São mostradas separadamente a ranhura do perfil, a porca T e o parafuso, a cantoneira e a união de extremidade para conferir cada encaixe.</desc>
  <rect width="1200" height="700" fill="#f6f8fa"/><text x="60" y="72" fill="#17324d" font-family="Arial,sans-serif" font-size="34" font-weight="700">Confira cada interface de encaixe</text><text x="60" y="112" fill="#526575" font-family="Arial,sans-serif" font-size="21">Ilustrativo. Não indica dimensões nem compatibilidade entre marcas.</text>
  <g transform="translate(70 185)"><rect x="0" y="90" width="380" height="290" rx="12" fill="#d8e0e7" stroke="#526575" stroke-width="5"/><rect x="132" y="84" width="116" height="120" fill="#f6f8fa" stroke="#526575" stroke-width="5"/><rect x="155" y="130" width="70" height="118" rx="8" fill="#087e8b" stroke="#075c65" stroke-width="5"/><path d="M190 20v140M166 158h48" fill="none" stroke="#d56b25" stroke-width="14" stroke-linecap="round"/><circle cx="190" cy="22" r="16" fill="#d56b25"/><text x="190" y="425" text-anchor="middle" fill="#17324d" font-family="Arial,sans-serif" font-size="27" font-weight="700">Perfil e ranhura</text><text x="190" y="461" text-anchor="middle" fill="#526575" font-family="Arial,sans-serif" font-size="20">abertura · cavidade · acesso</text></g>
  <g transform="translate(505 190)"><rect x="0" y="105" width="210" height="45" rx="8" fill="#087e8b" stroke="#075c65" stroke-width="4"/><path d="M105 0v238M78 126h54" stroke="#d56b25" stroke-width="15" stroke-linecap="round"/><rect x="38" y="270" width="135" height="24" rx="6" fill="#f0b323" stroke="#8a6111" stroke-width="4"/><text x="105" y="350" text-anchor="middle" fill="#17324d" font-family="Arial,sans-serif" font-size="27" font-weight="700">Porca e parafuso</text><text x="105" y="386" text-anchor="middle" fill="#526575" font-family="Arial,sans-serif" font-size="20">rosca · comprimento · apoio</text></g>
  <g transform="translate(785 200)"><path d="M35 55h225v48H83v185H35z" fill="#f0b323" stroke="#8a6111" stroke-width="5" stroke-linejoin="round"/><circle cx="60" cy="80" r="12" fill="#f6f8fa" stroke="#8a6111" stroke-width="4"/><circle cx="60" cy="255" r="12" fill="#f6f8fa" stroke="#8a6111" stroke-width="4"/><circle cx="235" cy="80" r="12" fill="#f6f8fa" stroke="#8a6111" stroke-width="4"/><text x="147" y="350" text-anchor="middle" fill="#17324d" font-family="Arial,sans-serif" font-size="27" font-weight="700">Cantoneira</text><text x="147" y="386" text-anchor="middle" fill="#526575" font-family="Arial,sans-serif" font-size="20">furos · orientação · acesso</text></g>
  <g transform="translate(1000 205)"><rect x="30" y="65" width="90" height="220" rx="6" fill="#d8e0e7" stroke="#526575" stroke-width="5"/><path d="M-10 175h130" stroke="#087e8b" stroke-width="28" stroke-linecap="round"/><path d="M-10 175h38" stroke="#f6f8fa" stroke-width="10" stroke-dasharray="8 8"/><text x="75" y="350" text-anchor="middle" fill="#17324d" font-family="Arial,sans-serif" font-size="25" font-weight="700">União de topo</text><text x="75" y="386" text-anchor="middle" fill="#526575" font-family="Arial,sans-serif" font-size="19">ambos os lados</text></g>
  <path d="M460 330h35m230 0h45m250 0h-15" stroke="#738696" stroke-width="4" stroke-dasharray="8 9"/><rect x="60" y="620" width="1080" height="2" fill="#d4dde4"/><text x="600" y="666" text-anchor="middle" fill="#17324d" font-family="Arial,sans-serif" font-size="22" font-weight="700">Confira cada união no desenho e na referência da peça antes de pedir.</text>
</svg>
