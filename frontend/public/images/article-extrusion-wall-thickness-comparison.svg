<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Wall thickness changes the extrusion section and weight</title>
  <desc id="desc">Two aluminum profile cross-sections share a similar outside envelope but have different internal wall thicknesses and material areas.</desc>
  <rect width="1200" height="620" fill="#f5f8fc"/>
  <text x="600" y="58" text-anchor="middle" fill="#12345a" font-family="Arial, sans-serif" font-size="32" font-weight="700">Same outside envelope. Different section area.</text>
  <text x="300" y="112" text-anchor="middle" fill="#31516f" font-family="Arial, sans-serif" font-size="21">Illustrative section A</text>
  <text x="900" y="112" text-anchor="middle" fill="#31516f" font-family="Arial, sans-serif" font-size="21">Illustrative section B</text>
  <g transform="translate(160 155)">
    <path d="M0 0H280V32H32V248H248V32H280V280H0Z M68 68H212V212H68Z" fill="#8fb6d8" fill-rule="evenodd" stroke="#15528a" stroke-width="5" stroke-linejoin="round"/>
    <line x1="16" y1="-17" x2="264" y2="-17" stroke="#173f67" stroke-width="2"/>
    <path d="M16 -24v14M264 -24v14" stroke="#173f67" stroke-width="2"/>
    <text x="140" y="-34" text-anchor="middle" fill="#173f67" font-family="Arial, sans-serif" font-size="18">same nominal outside width</text>
    <path d="M48 28v28M39 28h18M39 56h18" stroke="#bb6400" stroke-width="3"/>
    <text x="64" y="48" fill="#8a4b00" font-family="Arial, sans-serif" font-size="17">wall</text>
    <text x="140" y="320" text-anchor="middle" fill="#31516f" font-family="Arial, sans-serif" font-size="19">Section area and kg/m must be verified</text>
  </g>
  <g transform="translate(760 155)">
    <path d="M0 0H280V54H54V226H226V54H280V280H0Z M98 98H182V182H98Z" fill="#e6a94d" fill-rule="evenodd" stroke="#15528a" stroke-width="5" stroke-linejoin="round"/>
    <line x1="16" y1="-17" x2="264" y2="-17" stroke="#173f67" stroke-width="2"/>
    <path d="M16 -24v14M264 -24v14" stroke="#173f67" stroke-width="2"/>
    <text x="140" y="-34" text-anchor="middle" fill="#173f67" font-family="Arial, sans-serif" font-size="18">same nominal outside width</text>
    <path d="M48 50v46M39 50h18M39 96h18" stroke="#bb6400" stroke-width="3"/>
    <text x="64" y="78" fill="#8a4b00" font-family="Arial, sans-serif" font-size="17">wall</text>
    <text x="140" y="320" text-anchor="middle" fill="#31516f" font-family="Arial, sans-serif" font-size="19">Not an engineering or scale drawing</text>
  </g>
  <rect x="72" y="535" width="1056" height="52" rx="4" fill="#123f73"/>
  <text x="600" y="569" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="700">Compare the complete approved cross-section, not one wall dimension alone.</text>
</svg>
