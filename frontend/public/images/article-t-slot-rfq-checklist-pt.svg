<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Checklist de RFQ para perfil T-slot e acessórios</title><desc id="desc">Cinco etapas para identificar o perfil, especificar componentes, conferir a montagem, aprovar uma amostra e definir o escopo comercial.</desc><rect width="1200" height="760" fill="#f6f8fa"/><text x="64" y="76" fill="#17324d" font-family="Arial,sans-serif" font-size="36" font-weight="700">Uma RFQ T-slot mais clara</text><text x="64" y="116" fill="#526575" font-family="Arial,sans-serif" font-size="21">Separe os dados confirmados das dúvidas em aberto.</text>
  <g font-family="Arial,sans-serif"><g transform="translate(64 165)"><rect width="1072" height="92" rx="10" fill="#fff" stroke="#cbd5dd" stroke-width="2"/><circle cx="48" cy="46" r="27" fill="#087e8b"/><text x="48" y="54" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">1</text><text x="96" y="41" fill="#17324d" font-size="24" font-weight="700">Identifique o perfil</text><text x="96" y="70" fill="#526575" font-size="19">Código da peça · revisão · ranhura e interfaces</text></g>
  <g transform="translate(64 273)"><rect width="1072" height="92" rx="10" fill="#fff" stroke="#cbd5dd" stroke-width="2"/><circle cx="48" cy="46" r="27" fill="#087e8b"/><text x="48" y="54" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">2</text><text x="96" y="41" fill="#17324d" font-size="24" font-weight="700">Liste cada componente</text><text x="96" y="70" fill="#526575" font-size="19">Porca e parafuso · cantoneira · conector · retenção · quantidade</text></g>
  <g transform="translate(64 381)"><rect width="1072" height="92" rx="10" fill="#fff" stroke="#cbd5dd" stroke-width="2"/><circle cx="48" cy="46" r="27" fill="#087e8b"/><text x="48" y="54" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">3</text><text x="96" y="41" fill="#17324d" font-size="24" font-weight="700">Descreva a montagem</text><text x="96" y="70" fill="#526575" font-size="19">Orientação · sequência · painel · acesso às ferramentas</text></g>
  <g transform="translate(64 489)"><rect width="1072" height="92" rx="10" fill="#fff" stroke="#cbd5dd" stroke-width="2"/><circle cx="48" cy="46" r="27" fill="#087e8b"/><text x="48" y="54" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">4</text><text x="96" y="41" fill="#17324d" font-size="24" font-weight="700">Aprove uma amostra representativa</text><text x="96" y="70" fill="#526575" font-size="19">Encaixe · alinhamento · apoio · acesso · acabamento</text></g>
  <g transform="translate(64 597)"><rect width="1072" height="92" rx="10" fill="#fff" stroke="#cbd5dd" stroke-width="2"/><circle cx="48" cy="46" r="27" fill="#d56b25"/><text x="48" y="54" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">5</text><text x="96" y="41" fill="#17324d" font-size="24" font-weight="700">Feche o escopo do pedido</text><text x="96" y="70" fill="#526575" font-size="19">Inclusões e exclusões · acabamento · embalagem · destino · prazo</text></g></g>
</svg>
