<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">How project changes affect extrusion lead time</title><desc id="desc">Change impact chain from revision change to review, sample, reapproval and schedule rebaseline.</desc><rect width="1200" height="460" fill="#f4f7fa"/><text x="60" y="68" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#15334b">When a requirement changes, re-baseline the affected gates</text>
  <g font-family="Arial,sans-serif"><g transform="translate(70 150)"><rect width="195" height="150" rx="12" fill="#fff" stroke="#cbd6df" stroke-width="2"/><text x="22" y="48" font-size="19" font-weight="700" fill="#15334b">Change raised</text><text x="22" y="85" font-size="16" fill="#506474">section / finish /</text><text x="22" y="111" font-size="16" fill="#506474">quantity / delivery</text></g><g transform="translate(330 150)"><rect width="195" height="150" rx="12" fill="#fff" stroke="#cbd6df" stroke-width="2"/><text x="22" y="48" font-size="19" font-weight="700" fill="#15334b">Impact reviewed</text><text x="22" y="85" font-size="16" fill="#506474">die / stock / capacity /</text><text x="22" y="111" font-size="16" fill="#506474">finish / freight</text></g><g transform="translate(590 150)"><rect width="195" height="150" rx="12" fill="#fff" stroke="#cbd6df" stroke-width="2"/><text x="22" y="48" font-size="19" font-weight="700" fill="#15334b">Evidence updated</text><text x="22" y="85" font-size="16" fill="#506474">sample / drawing /</text><text x="22" y="111" font-size="16" fill="#506474">approval as needed</text></g><g transform="translate(850 150)"><rect width="250" height="150" rx="12" fill="#0b477a"/><text x="22" y="48" font-size="19" font-weight="700" fill="#fff">New baseline agreed</text><text x="22" y="85" font-size="16" fill="#e4edf2">owner / revised dates /</text><text x="22" y="111" font-size="16" fill="#e4edf2">open risks in writing</text></g></g>
  <g stroke="#92a6b5" stroke-width="5" fill="none"><path d="M265 225h58"/><path d="M525 225h58"/><path d="M785 225h58"/></g><g fill="#92a6b5"><path d="m316 214 14 11-14 11z"/><path d="m576 214 14 11-14 11z"/><path d="m836 214 14 11-14 11z"/></g><text x="70" y="370" font-family="Arial,sans-serif" font-size="17" fill="#506474">Do not keep an old promised ship date attached to a changed specification without confirming which downstream stages moved.</text>
</svg>
