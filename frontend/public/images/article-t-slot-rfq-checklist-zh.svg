<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">T 型槽配件询价核对清单</title><desc id="desc">采购方应确认型材、配套零件、装配方式、样件试装和订单范围这五项。</desc><rect width="1200" height="760" fill="#f6f8fa"/><text x="64" y="76" fill="#17324d" font-family="sans-serif" font-size="36" font-weight="700">让 T 型槽配件询价更清楚</text><text x="64" y="116" fill="#526575" font-family="sans-serif" font-size="21">把已确认的信息与待确认问题分开记录。</text>
  <g font-family="sans-serif"><g transform="translate(64 165)"><rect width="1072" height="92" rx="10" fill="#fff" stroke="#cbd5dd" stroke-width="2"/><circle cx="48" cy="46" r="27" fill="#087e8b"/><text x="48" y="54" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">1</text><text x="96" y="41" fill="#17324d" font-size="24" font-weight="700">确认型材型号</text><text x="96" y="70" fill="#526575" font-size="19">零件号 · 图纸版本 · 槽口和接口细节</text></g>
  <g transform="translate(64 273)"><rect width="1072" height="92" rx="10" fill="#fff" stroke="#cbd5dd" stroke-width="2"/><circle cx="48" cy="46" r="27" fill="#087e8b"/><text x="48" y="54" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">2</text><text x="96" y="41" fill="#17324d" font-size="24" font-weight="700">列明每个配套零件</text><text x="96" y="70" fill="#526575" font-size="19">螺母与螺栓 · 角码 · 接头 · 面板固定件 · 数量</text></g>
  <g transform="translate(64 381)"><rect width="1072" height="92" rx="10" fill="#fff" stroke="#cbd5dd" stroke-width="2"/><circle cx="48" cy="46" r="27" fill="#087e8b"/><text x="48" y="54" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">3</text><text x="96" y="41" fill="#17324d" font-size="24" font-weight="700">说明装配方式</text><text x="96" y="70" fill="#526575" font-size="19">接头方向 · 装配顺序 · 面板配合 · 工具空间</text></g>
  <g transform="translate(64 489)"><rect width="1072" height="92" rx="10" fill="#fff" stroke="#cbd5dd" stroke-width="2"/><circle cx="48" cy="46" r="27" fill="#087e8b"/><text x="48" y="54" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">4</text><text x="96" y="41" fill="#17324d" font-size="24" font-weight="700">批准代表性样件</text><text x="96" y="70" fill="#526575" font-size="19">配合 · 对位 · 贴合 · 操作空间 · 表面保护</text></g>
  <g transform="translate(64 597)"><rect width="1072" height="92" rx="10" fill="#fff" stroke="#cbd5dd" stroke-width="2"/><circle cx="48" cy="46" r="27" fill="#d56b25"/><text x="48" y="54" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">5</text><text x="96" y="41" fill="#17324d" font-size="24" font-weight="700">明确订单范围</text><text x="96" y="70" fill="#526575" font-size="19">包含与排除项 · 表面处理 · 包装 · 目的地 · 交期</text></g></g>
</svg>
