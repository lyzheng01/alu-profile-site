server {
    listen 80;
    server_name lingyealuminum.com www.lingyealuminum.com lingyealu.com www.lingyealu.com;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    return 301 https://lingyealu.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name lingyealuminum.com www.lingyealuminum.com www.lingyealu.com;

    ssl_certificate /etc/nginx/ssl/aluminum/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/aluminum/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    return 301 https://lingyealu.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name lingyealu.com;

    ssl_certificate /etc/nginx/ssl/aluminum/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/aluminum/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /www/wwwroot/Aluminum/frontend/build;
    index index.html;
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://127.0.0.1:8010/api/;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8010/admin/;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api-auth/ {
        proxy_pass http://127.0.0.1:8010/api-auth/;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /media/ {
        alias /www/wwwroot/Aluminum/backend/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location ^~ /static/admin/ {
        alias /www/wwwroot/Aluminum/backend/staticfiles/admin/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location ^~ /static/rest_framework/ {
        alias /www/wwwroot/Aluminum/backend/staticfiles/rest_framework/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location /static/ {
        alias /www/wwwroot/Aluminum/frontend/build/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location = / {
        return 301 https://lingyealu.com/en;
    }

    location ~ ^/(en|zh|es|pt)/products/2020-3030-4040-t-slot-aluminium-profiles/?$ {
        return 301 /$1/products/category/t-slot-profiles;
    }

    location ~ ^/(en|zh|es|pt)/products/?$ {
        if ($args = "category=1") { return 301 /$1/products/category/cabinet-profiles; }
        if ($args = "category=2") { return 301 /$1/products/category/industrial-profiles; }
        if ($args = "category=3") { return 301 /$1/products/category/t-slot-profiles; }
        if ($args = "category=4") { return 301 /$1/products/category/windows-doors; }
        if ($args = "category=5") { return 301 /$1/products/category/standard-aluminium-profiles; }
        try_files $uri $uri/index.html =404;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }
}
