server {
    listen 80;
    server_name lingyealuminum.com www.lingyealuminum.com lingyealu.com www.lingyealu.com;

    return 301 https://lingyealuminum.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name lingyealuminum.com www.lingyealuminum.com lingyealu.com www.lingyealu.com;

    ssl_certificate /etc/nginx/ssl/aluminum/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/aluminum/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /www/wwwroot/Aluminum/frontend/build;
    index index.html;
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://127.0.0.1:8010/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8010/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api-auth/ {
        proxy_pass http://127.0.0.1:8010/api-auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /media/ {
        alias /www/wwwroot/Aluminum/backend/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /static/admin/ {
        alias /www/wwwroot/Aluminum/backend/staticfiles/admin/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /static/rest_framework/ {
        alias /www/wwwroot/Aluminum/backend/staticfiles/rest_framework/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /static/ {
        alias /www/wwwroot/Aluminum/frontend/build/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
